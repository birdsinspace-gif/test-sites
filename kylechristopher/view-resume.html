<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kyle Christopher Resume</title>
  <meta name="robots" content="noindex" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #08111f; overflow: hidden; font-family: Aptos, "Segoe UI", Arial, sans-serif; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 16px; letter-spacing: .01em; }
    #viewer { display: none; width: 100%; height: 100%; border: 0; }
    #fallback { display: none; color: #fff; text-align: center; padding: 48px 24px; }
    #fallback a { color: #fff; }
  </style>
</head>
<body>
  <div id="status">Opening resume…</div>
  <embed id="viewer" type="application/pdf" />
  <div id="fallback">The PDF could not be displayed inline. <a id="fallbackLink" href="#">Open the resume</a>.</div>
  <script>
    const parts = [
      'resume-v4/part00.txt',
      'resume-v4/part01.txt',
      'resume-v4/part02.txt',
      'resume-v4/part03.txt',
      'resume-v4/tail00.txt',
      'resume-v4/tail01.txt',
      'resume-v4/tail02.txt',
      'resume-v4/tail03.txt',
      'resume-v4/tail04.txt',
      'resume-v4/tail05.txt'
    ];

    (async () => {
      try {
        const encoded = (await Promise.all(parts.map(path => fetch(path, { cache: 'no-store' }).then(r => {
          if (!r.ok) throw new Error(`Failed to load ${path}`);
          return r.text();
        })))).join('').replace(/\s+/g, '');

        const binary = atob(encoded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

        const blob = new Blob([bytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const viewer = document.getElementById('viewer');
        viewer.src = url;
        viewer.style.display = 'block';
        document.getElementById('status').style.display = 'none';
        document.getElementById('fallbackLink').href = url;
      } catch (error) {
        console.error(error);
        document.getElementById('status').style.display = 'none';
        document.getElementById('fallback').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
